<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background subtle ambient glow -->
    <radialGradient id="cAmbGlow" cx="50%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#0066ff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Deep Void Sphere Base -->
    <radialGradient id="cSphereCore" cx="42%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#0e223d" />
      <stop offset="35%" stop-color="#071326" />
      <stop offset="70%" stop-color="#040914" />
      <stop offset="100%" stop-color="#010308" />
    </radialGradient>

    <!-- Sphere Specular Highlight (Upper Right Arc) -->
    <radialGradient id="cSphereSpecular" cx="68%" cy="32%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#7dd3fc" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Inner Ambient Rim Glow (Lower Left) -->
    <radialGradient id="cSphereRimGlow" cx="30%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Chrome Outer Ring Metallic Gradient -->
    <linearGradient id="cChromeRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="18%" stop-color="#e2e8f0" />
      <stop offset="35%" stop-color="#94a3b8" />
      <stop offset="52%" stop-color="#334155" />
      <stop offset="68%" stop-color="#64748b" />
      <stop offset="82%" stop-color="#cbd5e1" />
      <stop offset="92%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Chrome Ring Bevel / Inner Specular -->
    <linearGradient id="cRingBevel" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Electric Cyan Energy Orbit -->
    <linearGradient id="cEnergyBeam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#00d4ff" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#0066ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.95" />
    </linearGradient>

    <!-- Letters E-L-Y Metallic Silver Gradient -->
    <linearGradient id="cLetterChrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Letter S Electric Cyan Gradient -->
    <linearGradient id="cLetterCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="30%" stop-color="#00f0ff" />
      <stop offset="75%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Flare Point Gradient -->
    <radialGradient id="cFlareGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#67e8f9" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="cNeonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cCyanTextGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Backdrop Aura -->
  <circle cx="250" cy="200" r="195" fill="url(#cAmbGlow)" />

  <!-- === ORBITAL SYMBOL (Center Y: 200) === -->
  <g transform="translate(0, -50)">
    <!-- Back Layer of Energy Orbit -->
    <g transform="rotate(-38 250 250)">
      <path
        d="M 50 250 A 200 125 0 0 1 450 250"
        fill="none"
        stroke="url(#cEnergyBeam)"
        stroke-width="5"
        stroke-linecap="round"
        filter="url(#cNeonGlow)"
        opacity="0.75"
      />
    </g>

    <!-- Back Chrome Ring -->
    <g transform="rotate(-38 250 250)">
      <path
        d="M 40 250 A 210 135 0 0 1 460 250 L 418 250 A 168 95 0 0 0 82 250 Z"
        fill="url(#cChromeRing)"
        opacity="0.85"
      />
    </g>

    <!-- Central Obsidian Sphere -->
    <g>
      <circle cx="250" cy="250" r="105" fill="url(#cSphereCore)" />
      <circle cx="250" cy="250" r="105" fill="url(#cSphereRimGlow)" />
      <circle cx="250" cy="250" r="105" fill="url(#cSphereSpecular)" />
      <path
        d="M 235 152 C 285 158, 335 195, 350 248 C 344 220, 320 180, 270 160 Z"
        fill="#ffffff"
        opacity="0.8"
        filter="url(#cSoftGlow)"
      />
    </g>

    <!-- Front Sculpted Chrome Ring -->
    <g transform="rotate(-38 250 250)">
      <path
        d="M 40 250 A 210 135 0 0 0 460 250 L 418 250 A 168 95 0 0 1 82 250 Z"
        fill="url(#cChromeRing)"
      />
      <path
        d="M 82 250 A 168 95 0 0 0 418 250"
        fill="none"
        stroke="url(#cRingBevel)"
        stroke-width="3"
      />
      <path
        d="M 40 250 A 210 135 0 0 0 460 250"
        fill="none"
        stroke="#ffffff"
        stroke-width="2.5"
        opacity="0.9"
      />
      <path
        d="M 70 270 A 210 135 0 0 0 440 260"
        fill="none"
        stroke="#00f0ff"
        stroke-width="3.5"
        filter="url(#cSoftGlow)"
        opacity="0.85"
      />
    </g>

    <!-- Front Glowing Energy Orbit -->
    <g transform="rotate(-38 250 250)">
      <path
        d="M 45 250 A 205 130 0 0 0 455 250"
        fill="none"
        stroke="url(#cEnergyBeam)"
        stroke-width="6.5"
        stroke-linecap="round"
        filter="url(#cNeonGlow)"
      />
      <path
        d="M 45 250 A 205 130 0 0 0 455 250"
        fill="none"
        stroke="#ffffff"
        stroke-width="2"
        opacity="0.9"
      />
    </g>

    <!-- Apex Starbursts -->
    <g transform="translate(378, 148)">
      <circle cx="0" cy="0" r="26" fill="url(#cFlareGlow)" />
      <ellipse cx="0" cy="0" rx="22" ry="2.5" fill="#ffffff" filter="url(#cSoftGlow)" />
      <ellipse cx="0" cy="0" rx="2.5" ry="22" fill="#ffffff" filter="url(#cSoftGlow)" />
      <circle cx="0" cy="0" r="4" fill="#ffffff" />
    </g>

    <g transform="translate(122, 352)">
      <circle cx="0" cy="0" r="20" fill="url(#cFlareGlow)" />
      <ellipse cx="0" cy="0" rx="16" ry="2" fill="#ffffff" transform="rotate(-35)" filter="url(#cSoftGlow)" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
    </g>
  </g>

  <!-- === TYPOGRAPHY "E L Y S" === -->
  <g transform="translate(86, 435)">
    <!-- Letter E -->
    <path
      d="M 0 0 L 46 0 L 46 11 L 13 11 L 13 23 L 40 23 L 40 34 L 13 34 L 13 46 L 46 46 L 46 57 L 0 57 Z"
      fill="url(#cLetterChrome)"
    />

    <!-- Letter L -->
    <path
      d="M 94 0 L 107 0 L 107 46 L 140 46 L 140 57 L 94 57 Z"
      fill="url(#cLetterChrome)"
    />

    <!-- Letter Y -->
    <path
      d="M 188 0 L 203 0 L 217 24 L 231 0 L 246 0 L 224 35 L 224 57 L 210 57 L 210 35 Z"
      fill="url(#cLetterChrome)"
    />

    <!-- Letter S (Cyan Energy) -->
    <path
      d="M 314 0 C 323 0, 328 5, 328 14 L 314 14 C 314 10, 312 8, 306 8 L 293 8 C 286 8, 283 11, 283 16 C 283 23, 288 26, 298 28 L 307 30 C 320 33, 328 38, 328 47 C 328 54, 321 57, 308 57 L 287 57 C 278 57, 274 52, 274 43 L 288 43 C 288 47, 291 49, 298 49 L 310 49 C 314 49, 316 47, 316 43 C 316 38, 311 35, 301 33 L 293 31 C 280 28, 272 23, 272 14 C 272 5, 280 0, 294 0 Z"
      fill="url(#cLetterCyan)"
      filter="url(#cCyanTextGlow)"
    />
  </g>
</svg>
