<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" width="100%" height="100%" fill="none">
  <defs>
    <!-- Deep Blue Sphere Base for Light Background -->
    <radialGradient id="lSphereCore" cx="42%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="35%" stop-color="#0f265c" />
      <stop offset="70%" stop-color="#09142e" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Sphere Specular Highlight -->
    <radialGradient id="lSphereSpecular" cx="68%" cy="32%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#7dd3fc" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Chrome Outer Ring with Contrast for Light Background -->
    <linearGradient id="lChromeRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#cbd5e1" />
      <stop offset="45%" stop-color="#475569" />
      <stop offset="65%" stop-color="#1e293b" />
      <stop offset="85%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="lRingBevel" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="lEnergyBeam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Letters E-L-Y Slate/Navy for Light Background -->
    <linearGradient id="lLetterNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Letter S Electric Cyan for Light Background -->
    <linearGradient id="lLetterCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="60%" stop-color="#0096c7" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>

    <filter id="lGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- === ORBITAL SYMBOL === -->
  <g transform="translate(0, -30)">
    <!-- Back Layer of Energy Orbit -->
    <g transform="rotate(-38 250 250)">
      <path
        d="M 50 250 A 200 125 0 0 1 450 250"
        fill="none"
        stroke="url(#lEnergyBeam)"
        stroke-width="5"
        stroke-linecap="round"
        filter="url(#lGlow)"
        opacity="0.8"
      />
    </g>

    <!-- Back Chrome Ring -->
    <g transform="rotate(-38 250 250)">
      <path
        d="M 40 250 A 210 135 0 0 1 460 250 L 418 250 A 168 95 0 0 0 82 250 Z"
        fill="url(#lChromeRing)"
        opacity="0.85"
      />
    </g>

    <!-- Central Obsidian Sphere -->
    <g>
      <circle cx="250" cy="250" r="105" fill="url(#lSphereCore)" />
      <circle cx="250" cy="250" r="105" fill="url(#lSphereSpecular)" />
      <path
        d="M 235 152 C 285 158, 335 195, 350 248 C 344 220, 320 180, 270 160 Z"
        fill="#ffffff"
        opacity="0.85"
      />
    </g>

    <!-- Front Sculpted Chrome Ring -->
    <g transform="rotate(-38 250 250)">
      <path
        d="M 40 250 A 210 135 0 0 0 460 250 L 418 250 A 168 95 0 0 1 82 250 Z"
        fill="url(#lChromeRing)"
      />
      <path
        d="M 82 250 A 168 95 0 0 0 418 250"
        fill="none"
        stroke="url(#lRingBevel)"
        stroke-width="2.5"
      />
      <path
        d="M 40 250 A 210 135 0 0 0 460 250"
        fill="none"
        stroke="#ffffff"
        stroke-width="2.5"
        opacity="0.9"
      />
      <path
        d="M 70 270 A 210 135 0 0 0 440 260"
        fill="none"
        stroke="#0284c7"
        stroke-width="3"
        filter="url(#lGlow)"
        opacity="0.85"
      />
    </g>

    <!-- Front Energy Orbit -->
    <g transform="rotate(-38 250 250)">
      <path
        d="M 45 250 A 205 130 0 0 0 455 250"
        fill="none"
        stroke="url(#lEnergyBeam)"
        stroke-width="6"
        stroke-linecap="round"
        filter="url(#lGlow)"
      />
    </g>
  </g>

  <!-- === TYPOGRAPHY "E L Y S" === -->
  <g transform="translate(86, 470)">
    <!-- Letter E -->
    <path
      d="M 0 0 L 46 0 L 46 11 L 13 11 L 13 23 L 40 23 L 40 34 L 13 34 L 13 46 L 46 46 L 46 57 L 0 57 Z"
      fill="url(#lLetterNavy)"
    />

    <!-- Letter L -->
    <path
      d="M 94 0 L 107 0 L 107 46 L 140 46 L 140 57 L 94 57 Z"
      fill="url(#lLetterNavy)"
    />

    <!-- Letter Y -->
    <path
      d="M 188 0 L 203 0 L 217 24 L 231 0 L 246 0 L 224 35 L 224 57 L 210 57 L 210 35 Z"
      fill="url(#lLetterNavy)"
    />

    <!-- Letter S (Electric Cyan) -->
    <path
      d="M 314 0 C 323 0, 328 5, 328 14 L 314 14 C 314 10, 312 8, 306 8 L 293 8 C 286 8, 283 11, 283 16 C 283 23, 288 26, 298 28 L 307 30 C 320 33, 328 38, 328 47 C 328 54, 321 57, 308 57 L 287 57 C 278 57, 274 52, 274 43 L 288 43 C 288 47, 291 49, 298 49 L 310 49 C 314 49, 316 47, 316 43 C 316 38, 311 35, 301 33 L 293 31 C 280 28, 272 23, 272 14 C 272 5, 280 0, 294 0 Z"
      fill="url(#lLetterCyan)"
    />
  </g>

  <!-- === SUBTITLE "ADVANCED TASK SCHEDULER" === -->
  <text
    x="250"
    y="575"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="14.5"
    font-weight="700"
    letter-spacing="0.32em"
    fill="#475569"
  >
    ADVANCED TASK SCHEDULER
  </text>
</svg>
