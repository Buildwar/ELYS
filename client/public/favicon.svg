<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background subtle ambient glow -->
    <radialGradient id="favAmbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#0066ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Deep Void Sphere Base -->
    <radialGradient id="favSphereCore" cx="42%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#0e223d" />
      <stop offset="35%" stop-color="#071326" />
      <stop offset="70%" stop-color="#040914" />
      <stop offset="100%" stop-color="#010308" />
    </radialGradient>

    <!-- Sphere Specular Highlight (Upper Right Arc) -->
    <radialGradient id="favSphereSpecular" cx="68%" cy="32%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#7dd3fc" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Inner Ambient Rim Glow (Lower Left) -->
    <radialGradient id="favSphereRimGlow" cx="30%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Chrome Outer Ring Metallic Gradient -->
    <linearGradient id="favChromeRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="18%" stop-color="#e2e8f0" />
      <stop offset="35%" stop-color="#94a3b8" />
      <stop offset="52%" stop-color="#334155" />
      <stop offset="68%" stop-color="#64748b" />
      <stop offset="82%" stop-color="#cbd5e1" />
      <stop offset="92%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Chrome Ring Bevel / Inner Specular -->
    <linearGradient id="favRingBevel" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Electric Cyan Energy Orbit -->
    <linearGradient id="favEnergyBeam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#00d4ff" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#0066ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.95" />
    </linearGradient>

    <!-- Intense Flare Point Gradient -->
    <radialGradient id="favFlareGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#67e8f9" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#00f0ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>

    <!-- High-clarity filter for small sizes -->
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Aura -->
  <circle cx="250" cy="250" r="235" fill="url(#favAmbGlow)" />

  <!-- Back Energy Orbit -->
  <g transform="rotate(-38 250 250)">
    <path
      d="M 50 250 A 200 125 0 0 1 450 250"
      fill="none"
      stroke="url(#favEnergyBeam)"
      stroke-width="7"
      stroke-linecap="round"
      filter="url(#favGlow)"
    />
  </g>

  <!-- Back Chrome Ring -->
  <g transform="rotate(-38 250 250)">
    <path
      d="M 40 250 A 210 135 0 0 1 460 250 L 418 250 A 168 95 0 0 0 82 250 Z"
      fill="url(#favChromeRing)"
      opacity="0.85"
    />
  </g>

  <!-- Central Obsidian Sphere -->
  <g>
    <circle cx="250" cy="250" r="105" fill="url(#favSphereCore)" />
    <circle cx="250" cy="250" r="105" fill="url(#favSphereRimGlow)" />
    <circle cx="250" cy="250" r="105" fill="url(#favSphereSpecular)" />
    <path
      d="M 235 152 C 285 158, 335 195, 350 248 C 344 220, 320 180, 270 160 Z"
      fill="#ffffff"
      opacity="0.85"
    />
  </g>

  <!-- Front Sculpted Chrome Ring -->
  <g transform="rotate(-38 250 250)">
    <path
      d="M 40 250 A 210 135 0 0 0 460 250 L 418 250 A 168 95 0 0 1 82 250 Z"
      fill="url(#favChromeRing)"
    />
    <path
      d="M 82 250 A 168 95 0 0 0 418 250"
      fill="none"
      stroke="url(#favRingBevel)"
      stroke-width="3.5"
    />
    <path
      d="M 40 250 A 210 135 0 0 0 460 250"
      fill="none"
      stroke="#ffffff"
      stroke-width="3"
      opacity="0.95"
    />
    <path
      d="M 70 270 A 210 135 0 0 0 440 260"
      fill="none"
      stroke="#00f0ff"
      stroke-width="4.5"
      filter="url(#favGlow)"
      opacity="0.9"
    />
  </g>

  <!-- Front Glowing Energy Orbit -->
  <g transform="rotate(-38 250 250)">
    <path
      d="M 45 250 A 205 130 0 0 0 455 250"
      fill="none"
      stroke="url(#favEnergyBeam)"
      stroke-width="8"
      stroke-linecap="round"
      filter="url(#favGlow)"
    />
    <path
      d="M 45 250 A 205 130 0 0 0 455 250"
      fill="none"
      stroke="#ffffff"
      stroke-width="2.5"
      opacity="0.95"
    />
  </g>

  <!-- Apex Flares -->
  <g transform="translate(378, 148)">
    <circle cx="0" cy="0" r="28" fill="url(#favFlareGlow)" />
    <ellipse cx="0" cy="0" rx="24" ry="3.5" fill="#ffffff" />
    <ellipse cx="0" cy="0" rx="3.5" ry="24" fill="#ffffff" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
  </g>

  <g transform="translate(122, 352)">
    <circle cx="0" cy="0" r="22" fill="url(#favFlareGlow)" />
    <ellipse cx="0" cy="0" rx="18" ry="3" fill="#ffffff" transform="rotate(-35)" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>
</svg>