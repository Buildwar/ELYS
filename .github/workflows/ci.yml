name: ELYS CI/CD & Docker GHCR Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

# Minimal GITHUB_TOKEN permissions (Least Privilege)
permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Lint, Typecheck, Security & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Client Dependencies
        run: npm --prefix client ci

      - name: Dependency Security Audit
        run: |
          npm audit --audit-level=high || true
          npm --prefix client audit --audit-level=high || true

      - name: Frontend Linting (oxlint)
        run: npm --prefix client run lint

      - name: Server Typecheck & Build
        run: npm run build:server

      - name: Frontend Typecheck & Build
        run: npm run build:client

      - name: Run Security & Hardening Tests
        run: |
          node server/dist/index.js &
          SERVER_PID=$!
          sleep 3
          npm test
          kill -9 $SERVER_PID || true

  docker-ghcr:
    name: Build & Publish Docker Image to GHCR
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Extract Version from version.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./version.json').version")
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "ELYS Version is ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/buildwar/elys
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.get_version.outputs.VERSION }},enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
